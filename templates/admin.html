<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">

<h1 class="text-3xl font-bold mb-6 text-center">Messages Dashboard</h1>

<div class="max-w-5xl mx-auto bg-white shadow rounded-lg p-6">

<table class="w-full border">
    <tr class="bg-gray-200">
        <th class="p-2 border">ID</th>
        <th class="p-2 border">Name</th>
        <th class="p-2 border">Email</th>
        <th class="p-2 border">Message</th>
    </tr>

    {% for msg in messages %}
    <tr>
        <td class="p-2 border">{{ msg[0] }}</td>
        <td class="p-2 border">{{ msg[1] }}</td>
        <td class="p-2 border">{{ msg[2] }}</td>
        <td class="p-2 border">{{ msg[3] }}</td>
    </tr>
    {% endfor %}
</table>

</div>

</body>
</html>
